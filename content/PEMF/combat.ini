; combat.ini - a louder, messier sea battle.
;
; Everything here ADDS to the game's own effects; nothing is removed.
; Read once at startup. Numbers only, "name = number", comment freely.

; 0 leaves the sea battle exactly as shipped.
enabled = 1

; When a shot strikes a hull the game throws one piece of wreckage, sometimes.
; This many more go up as well (0..12): cannon barrels, gun carriages, casks...
extraDebris = 8
; ...and this percent of them are a man thrown into the sea, with a splash.
crewOverboard = 25

; How far apart the extra pieces start, in the battle's units.
debrisSpread = 350

; Size of the smoke and flash after each cannon shot, percent of stock (50..300).
muzzleSize = 260

; When YOUR broadside fires the camera kicks. Strength as a percent of the jolt
; of being hit (0 = no kick), and how long it lasts in milliseconds.
broadsideKick = 55
kickMs = 240

; A small jolt whenever any shot strikes a hull, percent of a hit (0 = none).
hitKick = 20

; The burst of smoke where a shot strikes. How long it hangs in the air, percent
; of stock (100..300; it also drifts more slowly), and how many more bursts go
; up around it (0..4), how far apart, in the effect's own units.
smokeLinger = 180
extraBlowouts = 2
blowoutSpread = 6
