; crew.ini - the crew and officer systems.
;
; Only one setting so far. The officer system will drive this number once it
; exists; the key is here so the mechanism can be tested and tuned before then.

[crew]

; PEMF's share of what the crew takes, as a PERCENTAGE ADDED to whatever the
; game itself awarded.
;
;   0    the stock game. PEMF takes no part. THIS IS THE DEFAULT.
;   25   a hundred pieces plundered becomes a hundred and twenty five.
;
; It applies to everything the game counts as plunder EARNED -- a captured
; ship, a sacked town, a dug-up treasure -- and never to gold you spend.
;
; The game announces its own figure ("@NUM gold pieces plundered!") and PEMF's
; share arrives just after it, in the log and in your hold.
;
; Range 0-500. Anything higher is treated as a typo and clamped.
lootBonusPercent = 0
