; suspicion.ini - how quickly a disguise falls apart, and what it costs.
;
; Every value here is read once at startup. Numbers only, one per line, and
; anything that is not "name = number" is ignored, so comment freely.
;
; The idea the whole system rests on: a disguise buys you CLOSENESS, and
; closeness is what gets you caught. Suspicion rises from being LOOKED AT, not
; from time passing -- open water is where a false flag is safest.

; ---------------------------------------------------------------- how it rises
; Suspicion runs 0 to 100, one meter per crown. What a crown makes of your
; colours depends on how it regards you:
;
;   THE BLACK  every crown is suspicious of the pirate flag.
;   FLAG
;   THEIR OWN  with their letter of marque you are one of theirs: a friend, no
;   COLOURS    suspicion at all. Without it (a bought flag) it is a DECEIT.
;   AN ENEMY'S they are at war with that crown AND already think badly of you
;   COLOURS    (reputation below 0). If they think well of you, they let it be.
;
; How fast it rises is scaled by their opinion of you: 100% at reputation 0,
; down to 40% when they like you, up to 250% when they loathe you.
;
; What makes it JUMP is an aggressive act -- attacking, taking or sacking
; something of theirs (the game itself says when, by taking reputation): the
; crown that suffered it jumps by aggressionSpike. Do it while wearing someone's
; colours and the disguise is blown on the spot.
;
; At 100 nothing is lost yet: the nearest ship of that crown falls in astern
; and TRAILS you. Do nothing aggressive for trailBackOffSec and she falls away
; and the meter drops back to the first rung.
;
; Rates are in TENTHS of a point per second (V2; the older rise* keys are no
; longer read). Each watcher counts for nothing at the edge of its range, once
; at mid range and twice alongside; at most maxWatchers count at once.

; Per watching ship of theirs, mid range. 5 = half a point a second.
rateShip = 5

; Their settlement, mid range.
ratePort = 4

; Per ship of theirs inside closeRange: they got a proper look.
rateClose = 8

; Added while that crown already has cause to know you (reputation below 0).
rateInfamy = 3

; At most this many ships count at once, however many are about.
maxWatchers = 3

; Enemy colours and the black flag rise at this percent of a disguise's rate.
enemyPercent = 60
piratePercent = 70

; How much an aggressive act adds to the meter of the crown that suffered it.
; A worse act counts more: up to three times this, as the game itself weighs
; the deed (the reputation it takes). Each one also costs you their good opinion, so the next look at
; you is a harder one.
aggressionSpike = 35

; ---------------------------------------------------------------- how it falls
; Points per second.

; Applied while you are still being watched.
decayWatched = 0

; Nobody in range. The ordinary cooling-off.
decayClear = 2

; Nobody in range AND you are well clear of where it was earned.
decayFarAway = 6

; ------------------------------------------------------------------ distances
; In the game's city units. The map is about 422,000 across; a harbour approach
; is a few thousand.
shipRange  = 14000
portRange  = 9000
closeRange = 4500

; How far you must get from where suspicion was raised before decayFarAway.
heatRadius = 45000

; ------------------------------------------------------------------ the ladder
threshNotice    = 30
threshWarning   = 60
threshChallenge = 90

; --------------------------------------------------------------- the trail
; At 100, a ship of theirs shadows you. She backs off after this many seconds
; with nothing aggressive from you, and after trailMaxSec whatever happens.
trailBackOffSec = 90
trailMaxSec = 300

; ------------------------------------------------------------- being unmasked
; A disguise blown by an act (or a failed bluff at the challenge) costs this
; much of that crown's opinion, through the ledger below -- forgiven in time if
; nothing more comes of it.
unmaskPenalty = 6

; ----------------------------------------------------------------- hunters
; Only a crown you are BELOW ZERO with sends pirate-hunters. How many it wants
; at sea grows with how badly it thinks of you and with your notoriety (what
; you have actually done to it):
;
;     below 0     one ship       -20   two       -40   three
;     notoriety 30 or more: one more
;
; They come ONE AT A TIME, from different ports, a crown sending at most one
; every huntIntervalSec. Each hunt that ends (you outran her, she gave up, she
; waited outside the harbour too long) buys huntCooldownSec before the next.
; Her strength comes from the engine's own formula (2 - reputation/5, 2..4).
;
; She is a real pirate-hunter: the game steers her at you, round islands and
; all. PEMF lifts the game's leash to her home port for its own hunters only.

hunterEnabled = 1
maxPerNation = 3
maxHuntersTotal = 3
huntIntervalSec = 180
huntCooldownSec = 240

; Sit in port this long and a hunter waiting outside gives up.
harbourWaitSec = 30

; How long she keeps looking before breaking off, in milliseconds.
hunterGiveUpMs = 240000

; Get this far from her and she loses you. In practice the overworld drops a
; ship that falls about 11,000 behind you, and that is announced as losing her.
hunterEscapeDist = 70000

; How often the log reports on her (distance, closing, heading), milliseconds.
hunterReaimMs = 5000

; ------------------------------------------------------------- a new career
; 1 = a new career serves no crown: no crown to pick at the tavern, the voyage
; begins in a pirate haven, flying the black flag. Sail where you like; a
; governor's letter of marque is what ties you to a crown (and gives you its
; flag). 0 = the game's own start: pick a crown, begin in one of its ports.
startUnaligned = 1

; A Pirate has no uniform of his own in the game's art, only the four crowns'
; colourings. Which one he wears until a letter of marque gives him a crown:
; 0 Spanish, 1 English, 2 French, 3 Dutch.
pirateOutfit = 1

; ------------------------------------------------------------ standing ledger
; PEMF keeps its own record of where you stand with each crown, and writes the
; result into the game's reputation. Two numbers make it up:
;
;   a FRIGHT   -- being seen through while wearing their colours. Temporary.
;   NOTORIETY  -- what you actually did to them. Permanent.
;
; Months of honest sailing before a fright is forgiven and your standing comes
; back. This is what lets a captain raise false colours, be found out, think
; better of the whole business and eventually be received in their ports again.
; It only ever applies if you did NOTHING with the disguise -- one hostile act
; and the fright stops being a fright.
;
; ⚠️ A MONTH IS SECONDS OF SAILING, NOT MINUTES. This shipped as 1 and that is
; far too short: the count is "months elapsed since the fright", so 1 means the
; very next month boundary, which can be a second or two later. In play a crown
; saw through the disguise, dispatched a pirate-hunter, and forgave the whole
; business three seconds afterwards -- and the hunter turned round and went home,
; because a hunt ends when the reputation that caused it does.
;
; Twelve is about a year of sailing, which is long enough to read as "eventually"
; rather than "immediately". A hunt already at sea now holds the fright open
; regardless of this number, so lowering it can no longer cut a chase short.
debtForgetMonths = 12

; How much of a hostile act's own penalty is ALSO remembered as notoriety, per
; point the game itself took off you. 1 mirrors it, so a pattern of raids
; outlives any single one. 0 keeps standing entirely the game's business and
; leaves us only the false-colours part.
actNotorietyShare = 1

; What the OTHER crowns take from an act committed against one of them, as a
; percentage of it. Everybody hates a pirate; nobody hates one as much as the
; nation he actually robbed. 0 makes piracy a purely bilateral matter.
actSpillPercent = 25

; How far away a crown may send a hunter from. Measured, not guessed: pursuers
; built within ~7,000 of the player survive indefinitely, ones built beyond
; ~11,000 are culled by the overworld inside two seconds. Past this we decline
; to dispatch rather than spawn a ship that quietly evaporates.
hunterMaxSpawnDist = 9000

; ------------------------------------------------------- flags for sale
; The trader at the back of the tavern keeps selling his usual wares; on this
; percentage of visits he ALSO has a crown's flag you do not have yet, offered
; after his own goods. Letters of marque give you a crown's flag for nothing.
flagOfferChance = 35
flagPrice = 1000

; How far PEMF's own share of a crown's opinion of you may go: the forgivable
; fright, and what you have actually done. The game's reputation runs in tens,
; so these keep a run of bad luck from burying a career.
debtCap = 15
notorietyCap = 25
