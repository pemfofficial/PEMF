; suspicion.ini - how quickly a disguise falls apart, and what it costs.
;
; Every value here is read once at startup. Numbers only, one per line, and
; anything that is not "name = number" is ignored, so comment freely.
;
; The idea the whole system rests on: a disguise buys you CLOSENESS, and
; closeness is what gets you caught. Suspicion rises from being LOOKED AT, not
; from time passing -- open water is where a false flag is safest.

; ---------------------------------------------------------------- how it rises
; Points per second. Suspicion runs 0 to 100.

; For each vessel of the nation whose flag you are wearing, within shipRange.
; They know their own navy, so this is the main way a disguise gets tested.
riseNearShip = 4

; While one of their settlements is within portRange.
riseNearPort = 3

; For each vessel of ANY nation inside closeRange. Somebody got a proper look.
riseCloseRange = 9

; Added on top when that nation already has cause to know you -- a captain with
; a bad name is harder to pass off as a stranger. Uses the game's own standing.
riseInfamy = 2

; ---------------------------------------------------------------- how it falls
; Also points per second.

; Applied while you are still being watched. Raise this to make observation
; itself survivable and only sustained closeness dangerous.
decayWatched = 2

; Nobody in range. The ordinary cooling-off.
decayClear = 3

; Nobody in range AND you are well clear of the water where it was earned.
; Sailing somewhere else genuinely helps: the people there have not heard yet.
decayFarAway = 8

; ------------------------------------------------------------------ distances
; In the game's city units. The whole map is about 422,000 across, and a
; harbour approach is a few thousand.

shipRange  = 6000
portRange  = 4000
closeRange = 3000

; How far you must get from where suspicion was last raised before the trail
; starts going cold and decayFarAway applies.
heatRadius = 20000

; ------------------------------------------------------------------ the ladder
; Where each beat happens on the way up.

threshNotice    = 30
threshWarning   = 60
threshChallenge = 90
threshUnmask    = 100

; ------------------------------------------------------------- what it costs
; How far your reputation with that nation drops when you are unmasked. This is
; the game's OWN hostility number, not one of ours: below 0 their ports close to
; you, and below -1 there is a price on your head and an amnesty to buy back.
; Real damage, but the kind a career can recover from.
repPenalty = 8

; ------------------------------------------------------------------ the hunter
; A crown that has seen through you sends someone. Her strength comes from the
; engine's own formula -- 2 minus reputation/10, clamped to 2..4 -- so the more
; they hate you, the worse what arrives.

hunterEnabled = 1

; How often she re-aims at you. Lower is more dogged and slightly more work.
hunterReaimMs = 5000

; How long she keeps looking before breaking off, in milliseconds.
hunterGiveUpMs = 240000

; Get this far from her and she loses you.
hunterEscapeDist = 70000

; The most hunters one nation may have at sea at once. How many ACTUALLY sail
; is decided by reputation when they are dispatched, and capped by this:
;
;     above -10   one ship
;     -10         two
;     -25         three
;     -45         four
;
; Their individual strength scales with the same number, so a captain the Dutch
; genuinely loathe gets four strong ships rather than one weak one. Set to 1 to
; keep it to a single pursuer however bad things get.
maxPerNation = 4

; ------------------------------------------------------------ standing ledger
; PEMF keeps its own record of where you stand with each crown, and writes the
; result into the game's reputation. Two numbers make it up:
;
;   a FRIGHT   -- being seen through while wearing their colours. Temporary.
;   NOTORIETY  -- what you actually did to them. Permanent.
;
; Months of honest sailing before a fright is forgiven and your standing comes
; back. This is what lets a captain raise false colours, be found out, think
; better of the whole business and eventually be received in their ports again.
; It only ever applies if you did NOTHING with the disguise -- one hostile act
; and the fright stops being a fright.
debtForgetMonths = 1

; How much of a hostile act's own penalty is ALSO remembered as notoriety, per
; point the game itself took off you. 1 mirrors it, so a pattern of raids
; outlives any single one. 0 keeps standing entirely the game's business and
; leaves us only the false-colours part.
actNotorietyShare = 1

; What the OTHER crowns take from an act committed against one of them, as a
; percentage of it. Everybody hates a pirate; nobody hates one as much as the
; nation he actually robbed. 0 makes piracy a purely bilateral matter.
actSpillPercent = 25

; How far away a crown may send a hunter from. Measured, not guessed: pursuers
; built within ~7,000 of the player survive indefinitely, ones built beyond
; ~11,000 are culled by the overworld inside two seconds. Past this we decline
; to dispatch rather than spawn a ship that quietly evaporates.
hunterMaxSpawnDist = 9000
