; keys.ini - the keys PEMF answers to while you are sailing.
;
; One letter each. They are read only at sea, with the game in front and no
; card already up. The defaults are letters the sailing view does not use
; (its own key table leaves B C E G H I J K M N O Q R T U X Y Z free; the
; WASD layout also uses V and F). Hold Ctrl and they are ignored, so PEMF's
; Ctrl+Shift tools never trip them.

; Choose which colours to fly, from the flags you have.
colours = Q

; Your crew and your officers.
crew = C

; The PEMF guide: what the mod adds, and how it works.
guide = H
