;   WASD key mappings for Sid Meier's Pirates!
;
;   Installed by PEMF. Your original file was saved next to this one as
;   KeyMap.ini.pemf-backup -- rename it back over KeyMap.ini to undo this.
;
;   PEMF installs this ONCE and then leaves the file alone, so anything you
;   change below survives. Delete the marker line at the bottom if you want
;   PEMF to install the WASD layout again.
;
;   The left-hand name carries the game's ORIGINAL default as a suffix, which
;   is documentation only -- the binding is the value on the right. The names
;   are left untouched so the file still matches the game's own reference.
;
;   Two collisions had to be resolved to free up WASD:
;     'a' was Attack Ship  -> moved to Space
;     'S' was Quick Save   -> moved to F5 (Quick Load moved to F9 to match)

;
; Commands for ship battles
[Battle]
Pause_P = P
ChainShot_c = c		;Also Num7
GrapeShot_g = g		;Also Num1
RoundShot_r = r		;Also Num3
ToggleChaseView_v = v	;Also Num9
FullSails_Num8 = w
ReefedSails_Num2 = s
TurnLeft_Num4 = a
TurnRight_Num6 = d
Fire_Space = Space	;Also Num5

;
; Commands for dancing with the governor's daughter
[Dance]
Pause_P = P
Forward_Num8 = w
Back_Num2 = s
Left_Num4 = a
Right_Num6 = d
CircleLeft_Num3 = q
CircleRight_Num1 = e

;
; Commands for dueling
[Duel]
Pause_P = P
Thrust_Num4 = a		;attack low
Parry_Num5 = Space
Chop_Num7 = q		;attack high
Slash_Num1 = e		;attack mid
Jump_NUm8 = w
Duck_Num2 = s
Taunt_Num6 = d

;
; Commands for land battles
[Fight]
Pause_P = P
Forward_Num8 = w
Back_Num2 = s
Left_Num4 = a
Right_Num6 = d
UpLeft_Num7 = Num7
UpRight_Num9 = Num9
DownLeft_Num1 = Num1
DownRight_Num3 = Num3
Target_Tab = Tab	;cycle through avalable targets
Fire_f = f	;Fire at chosen target
ChangeView_v = v	;change zoom level

;
; Commands for the menu screens
[Menu]
; Currently, there are no commands here

;
; Commands for sailing around the world
[Sail]
ToggleChaseView_v = v
AttackShip_a = Space	;was 'a', moved so A can steer
FullSails_Num8 = w
ReefedSails_Num2 = s
TurnLeft_Num4 = a
TurnRight_Num6 = d
QuickLoad_L = F9
QuickSave_S = F5	;was 'S', moved so S can reef

;
; Commands for the start menus
[Shell]
; Currently, there are no commands here

;
; Commands for sneaking into/out of towns
[Sneak]
Pause_P = P
Forward_Num8 = w
Back_Num2 = s
Left_Num4 = a
Right_Num6 = d
Run_Shift = Shift

