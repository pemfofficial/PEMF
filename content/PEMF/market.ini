; market.ini - prices that move.
;
; The game's own prices are untouched; PEMF adds movement on top of them.
; Read once at startup. Numbers only, "name = number", comment freely.

; 0 turns the whole thing off and leaves the game's prices exactly as shipped.
enabled = 1

; ------------------------------------------------------------ market news
; Now and then, word comes in of a shortage or a glut of one trade good around
; one port (food, luxuries, goods, spice or sugar). Towns within `radius` of it
; feel it too. The news shows as a notice; several can run at once (up to 3).

; Seconds between pieces of news, chosen at random in this range.
eventMinSec = 240
eventMaxSec = 600

; How long a shortage or glut lasts, seconds.
eventLastMin = 600
eventLastMax = 1500

; A shortage makes the good this many percent dearer...
shortageMin = 40
shortageMax = 90
; ...a glut this many percent cheaper (at most 90).
glutMin = 25
glutMax = 50

; How far around the port the news reaches, in the game's city units (the map
; is about 422,000 across).
radius = 60000

; --------------------------------------------------------------------- war
; A town whose crown is at war with anyone pays this many percent more.
warFood = 25
warCannon = 40
