; storms.ini - how big and how heavy the weather looks on the sailing map.
;
; PURELY VISUAL. These change how weather is DRAWN, not what it does to your
; ship. A bigger cloud is a bigger cloud.
;
; ⚠️ STORMS AND ORDINARY CLOUDS ARE TWO DIFFERENT THINGS. The game draws the
; dark storm from one prefab and the white fair-weather puffs from another, and
; they have separate settings below. Scaling the wrong one is exactly the mistake
; this file was written after making: the sky filled with enormous white clouds
; while the storms stayed the size they always were.
;
; Safe to edit. Read once at startup, every site checked against the game's own
; code before anything is written, and a rebuild never overwrites your edits.

; Master switch. 0 leaves the weather exactly as the game ships it.
enabled = 1

; ---------------------------------------------------------------- THE STORMS
; The dark, heavy weather you steer around. THIS is what you came here for.

; How big each storm is drawn. VANILLA IS 80.
; Proportional, so 160 is twice vanilla. Storms are already large in vanilla and
; sit low, so go up in steps -- past a point one storm covers the whole view and
; reads as fog rather than as weather you can sail around.
; Range 20-4000.
stormScale = 380

; How high the storm sits above the sea. VANILLA IS 300.
; RAISE THIS WHEN YOU RAISE stormScale. The two fight each other: a big cloud
; already spans a lot of sea, and a LOW big cloud swallows the camera, so the
; storm stops looking like a storm and starts looking like fog. Range 50-8000.
stormHeight = 1100

; ------------------------------------------------------- FAIR-WEATHER CLOUDS
; The ordinary white puffs. Left at vanilla by default -- scaling these up is
; what produced "the normal clouds look larger" with no change to the storms,
; and oversized overlapping puffs flicker where they intersect.

; VANILLA IS 250.
cloudScale = 250

; Weather SLOTS. VANILLA IS 3, AND 3 IS THE CEILING -- the value is clamped.
; This is not a taste call. The game keeps weather positions in two arrays that
; are exactly three entries long and sit back to back in memory, so a 4th slot
; reads and writes off the end of the first into the second. Storms and clouds
; share these slots, so this is not "how many clouds" -- it is "how many weather
; positions exist at all", and the game only has room for three.
cloudCount = 3

; VANILLA IS 500.
cloudHeight = 500

; ------------------------------------------------------------- STORM CLUSTERS
; A vanilla storm is ONE cloud, and the slot count above cannot be raised. So a
; squall line is built by drawing the storm prefab extra times around the real
; one. The extras are cosmetic -- the game's own storm, the one that throws
; lightning at you, is still the single cloud at the centre.

; How many EXTRA clouds to draw around the storm. 0 = vanilla, one cloud.
; Range 0-12. They sit in a ring, at fixed offsets that never move -- jittering
; them per frame would make the whole front strobe.
clusterCount = 9

; How far out the ring sits, in map units. For scale, a port is "in sight" at
; around 3000 and open sea is 10000+. Range 500-60000.
clusterSpread = 3200

; The extras' size as a PERCENT of the main storm, so the centre still reads as
; the heart of the weather. Range 10-200.
clusterScale = 105

; ------------------------------------------------------------ WEATHER THAT BITES
; Storms already cost you hull through the game's own lightning. This adds a
; little cargo going over the side while you are in one.
;
; GOLD IS NEVER TAKEN -- only trade goods. A squall emptying the strongbox would
; feel like theft rather than weather.

; 0 = off. Off by default: losing cargo is a real consequence and should not
; arrive as a surprise from a mod you installed for the look of the clouds.
cargoLoss = 1

; How bad the weather has to be before the sea takes anything. This is the
; GAME'S OWN weather value, not a radius we invented -- it rises smoothly as you
; close on a storm: about 32 sitting on top of it, 14 at 5,000 map units, 10 at
; 9,000, 4 far out. There is no hard edge to a storm; it is a gradient.
; 12 is roughly "well inside it". Range 1-32. Lower = bites from further out.
cargoLossIntensity = 6

; Kept for the log line only -- the value above is what actually decides.
cargoLossRadius = 9000

; Bitmask of cargo slots the sea will NEVER take. Bit 0 is gold, bit 6 is
; cannon, so 0x41 = 65 protects both, and gold is force-protected regardless.
; Losing plunder reads as theft rather than weather, and losing CANNON is not
; cargo attrition -- it is disarming your ship mid-voyage. Set to 1 if you want
; the sea to take your guns too.
cargoLossProtect = 65

; At most one loss this often, in milliseconds. Range 2000-600000.
cargoLossEveryMs = 20000

; Upper bound on units of a SINGLE good lost each time. The good is picked from
; what you actually carry. Range 1-20.
cargoLossMax = 3

; ---------------------------------------------------------------- HOW WET IT IS
; The engine works out how bad the weather is where you are with one curve:
;
;     intensity = weatherPower / (distance_to_storm + 4000)
;
; and the rain is multiplied by the result. VANILLA weatherPower IS 128000,
; which gives about 32 sitting on the storm, 14 at 5,000 map units and 4 far out.
; ⚠️ THIS IS A DROP-SIZE DIAL, NOT A DROP-COUNT DIAL. Measured both ways:
;   300000  fat white bars that visibly bend with perspective, 27-knot winds
;   128000  vanilla -- still large and in your face at the heart of a storm
;    70000  smaller, calmer drops and a gentler push
; The bend is the wind, and it scales with the same number. Raising this does
; NOT give heavier rain, only bigger rain. Genuinely DENSER rain needs the
; particle COUNT, which lives elsewhere in the sailing render and has not been
; isolated yet.
;
; Note this also shifts cargoLossIntensity's meaning -- the curve it reads is
; this one, so lowering weatherPower means lowering that threshold to match.
;
; ⚠️ NOT RAIN-ONLY. Five other places read the same value, including the sailing
; update -- which is where a storm's shove on your ship comes from. Turning this
; up makes storms wetter AND windier. For weather that is arguably the right
; bargain, but it is a gameplay change, not a visual one.
;
; Range 32000-2000000. 128000 = vanilla.
weatherPower = 45000
