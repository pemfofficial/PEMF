; widescreen.ini - widescreen and higher resolutions.
;
; With this on, Options -> Resolution offers every mode your display supports,
; not only the 4:3 ones. Pick a widescreen mode there (1920x1080, 2560x1440,
; 3840x2160...) and:
;
;   - the 3D world gets WIDER: you see more at the sides, nothing is stretched
;     and nothing is cropped off the top or bottom;
;   - the menus, maps and dialogs stay their original 4:3 shape, whole and
;     centred, with the mouse landing where you point.
;
; On a 4:3 resolution nothing changes at all.
;
; Safe to edit. Read once at startup, and a reinstall never overwrites your
; edits. Every address is checked against the game before anything is written;
; on a build PEMF does not recognise it leaves the display exactly as shipped.

; Master switch. 0 = the display behaves exactly as the stock game.
enabled = 1

; Offer every resolution in Options, not only 4:3 ones.
unlockModes = 1

; Show more of the world at the sides on a wide screen. 0 = the stock 4:3 view.
widenWorld = 1

; Keep the interface whole and centred, with the mouse corrected to match.
; 0 = the stock behaviour, which cuts off the top and bottom of the interface
; on a wide screen.
centerUi = 1

; On a wide screen, put the HUD in the corners of the screen: the compass,
; fame and purse at the bottom left, the command keypad at the bottom right,
; the ship panels and buttons out to the sides in a sea battle. Their mouse
; areas move with them. 0 = the HUD stays at the edges of the centred 4:3 area.
; Needs centerUi = 1.
hudCorners = 1

; Screenshots, for reporting display problems. Ctrl+Shift+X always saves one to
; PEMF\shots. Set a number of seconds here to also save one automatically that
; often (the last 40 are kept). 0 = only when you press the key.
autoShots = 0
